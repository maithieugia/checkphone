<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Check Số Điện Thoại</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      background: #f7f7f7;
    }
    input, button {
      padding: 10px;
      font-size: 16px;
      margin: 5px 0;
    }
    #loading {
      display: none;
      font-style: italic;
      color: gray;
    }
    #result {
      margin-top: 20px;
      white-space: pre-wrap;
      background: #fff;
      padding: 15px;
      border: 1px solid #ddd;
    }
  </style>
</head>
<body>
  <h2>Phân tích số điện thoại theo phong thủy</h2>
  <form id="phoneForm">
    <label>Nhập số điện thoại:</label><br>
    <input type="text" id="phoneInput" placeholder="Ví dụ: 0888134448" required />
    <button type="submit">Check</button>
  </form>

  <div id="loading">⏳ Đang xử lý...</div>
  <div id="result"></div>

  <script>
    const form = document.getElementById('phoneForm');
    const input = document.getElementById('phoneInput');
    const resultDiv = document.getElementById('result');
    const loadingDiv = document.getElementById('loading');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const phone = input.value.trim();
      if (!phone) return alert("Vui lòng nhập số điện thoại!");

      resultDiv.innerHTML = "";
      loadingDiv.style.display = "block";

      try {
        const response = await fetch('https://n8n.sieutho.vn/webhook/bf389061-2aa8-4a9b-b182-71a9096b0552', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ phone })
        });

        const data = await response.json();
        loadingDiv.style.display = "none";

        if (data.Ketqua) {
          resultDiv.innerHTML = `<strong>Kết quả:</strong><br>${data.Ketqua}`;
        } else {
          resultDiv.innerHTML = "❗ Không có kết quả hợp lệ trả về.";
        }
      } catch (error) {
        loadingDiv.style.display = "none";
        resultDiv.innerHTML = "❌ Đã xảy ra lỗi khi gửi dữ liệu.";
        console.error("Lỗi:", error);
      }
    });
  </script>
</body>
</html>
