<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phân Tích Số Điện Thoại Phong Thủy</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Be Vietnam Pro', sans-serif;
      background: linear-gradient(to right, #fbeec1, #f5d491);
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 600px;
      margin: 40px auto;
      padding: 30px;
      background: #fff;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      text-align: center;
    }
    h2 {
      color: #b71c1c;
      margin-bottom: 20px;
    }
    img {
      width: 120px;
      margin-bottom: 20px;
    }
    input {
      width: 80%;
      padding: 12px;
      font-size: 16px;
      border: 2px solid #ddd;
      border-radius: 8px;
      margin-bottom: 10px;
    }
    button {
      background: #d32f2f;
      color: white;
      padding: 12px 25px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background: #b71c1c;
    }
    #loading {
      display: none;
      margin-top: 15px;
      font-style: italic;
      color: #777;
    }
    #result {
      margin-top: 25px;
      text-align: left;
      white-space: pre-wrap;
      background: #f9fbe7;
      padding: 15px;
      border-radius: 10px;
      border-left: 5px solid #9e9d24;
    }
    @media (max-width: 600px) {
      input {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="https://cdn-icons-png.flaticon.com/512/3199/3199839.png" alt="Phong thủy icon">
    <h2>Phân Tích Số Điện Thoại Phong Thủy</h2>
    <form id="phoneForm">
      <input type="text" id="phoneInput" placeholder="Nhập số điện thoại (VD: 0888134448)" required />
      <br />
      <button type="submit">🔍 Kiểm tra</button>
    </form>
    <div id="loading">⏳ Đang phân tích phong thủy...</div>
    <div id="result"></div>
  </div>

  <script>
    const form = document.getElementById('phoneForm');
    const input = document.getElementById('phoneInput');
    const resultDiv = document.getElementById('result');
    const loadingDiv = document.getElementById('loading');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const phone = input.value.trim();
      if (!phone) return alert("Vui lòng nhập số điện thoại!");

      resultDiv.innerHTML = "";
      loadingDiv.style.display = "block";

      try {
        const response = await fetch('https://n8n.sieutho.vn/webhook/bf389061-2aa8-4a9b-b182-71a9096b0552', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ phone })
        });

        const data = await response.json();
        loadingDiv.style.display = "none";

        if (data.Ketqua) {
          resultDiv.innerHTML = `<strong>Kết quả:</strong><br>${data.Ketqua}`;
        } else {
          resultDiv.innerHTML = "❗ Không có kết quả hợp lệ trả về.";
        }
      } catch (error) {
        loadingDiv.style.display = "none";
        resultDiv.innerHTML = "❌ Đã xảy ra lỗi khi gửi dữ liệu.";
        console.error("Lỗi:", error);
      }
    });
  </script>
</body>
</html>
